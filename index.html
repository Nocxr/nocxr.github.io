<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Game Math Basics</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f6fa;--panel:#fff;--panel2:#edf1f7;--text:#19202b;--muted:#657184;--border:#d8dee9;--accent:#3867f4;--accent2:#f06a3c;--good:#16845b;--shadow:0 12px 36px rgba(22,32,50,.10)}
    @media(prefers-color-scheme:dark){:root{--bg:#11151c;--panel:#1a202a;--panel2:#222a36;--text:#edf2fa;--muted:#9ba8ba;--border:#343e4d;--accent:#6e91ff;--accent2:#ff8a5e;--good:#42c48a;--shadow:0 12px 36px rgba(0,0,0,.24)}}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif} button,input{font:inherit} button{color:inherit}
    .shell{max-width:1180px;margin:auto;padding:24px}.hero{margin-bottom:20px}.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.05;margin:0 0 8px}.hero p{margin:0;color:var(--muted);max-width:760px}
    .layout{display:grid;grid-template-columns:260px 1fr;gap:20px}.course-nav,.lesson{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
    .course-nav{padding:12px;align-self:start;position:sticky;top:16px}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;padding:4px 6px 8px}.progress-track{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:0 6px 12px}.progress-fill{height:100%;background:var(--good);width:0;transition:width .2s}
    .nav-button{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;display:grid;grid-template-columns:26px 1fr;gap:8px;cursor:pointer}.nav-button:hover{background:var(--panel2)}.nav-button.active{background:var(--accent);color:white}.nav-button.done .num{background:var(--good);color:white}.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:13px}.nav-button.active .num{background:rgba(255,255,255,.2)}
    .lesson{padding:clamp(18px,4vw,34px);min-width:0}.eyebrow{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.lesson h2{font-size:clamp(24px,4vw,36px);line-height:1.15;margin:4px 0 10px}.lead{font-size:18px;color:var(--muted);margin:0 0 22px;max-width:760px}
    .visual{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px;overflow:hidden}.visual canvas{display:block;width:100%;height:auto;aspect-ratio:16/8;background:var(--panel);border-radius:10px;touch-action:none}
    .controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}.controls label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}.controls input[type=range]{width:160px}.btn{border:1px solid var(--border);background:var(--panel);padding:8px 13px;border-radius:9px;cursor:pointer}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}
    .readout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.stat{background:var(--panel2);padding:12px;border-radius:10px}.stat small{display:block;color:var(--muted)}.stat strong{font-variant-numeric:tabular-nums;font-size:18px}
    .explain{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.box{border-top:1px solid var(--border);padding-top:14px}.box h3{margin:0 0 6px;font-size:16px}.box p{margin:0;color:var(--muted)} pre{margin:8px 0 0;background:var(--panel2);padding:12px;border-radius:10px;overflow:auto;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}.formula{font:18px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--text)}
    .footer-actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--border)}
    @media(max-width:800px){.shell{padding:14px}.layout{grid-template-columns:1fr}.course-nav{position:static}.nav-list{display:flex;overflow-x:auto;gap:4px}.nav-button{min-width:55px;width:auto;display:block;text-align:center}.nav-button span:last-child{display:none}.explain{grid-template-columns:1fr}.readout{grid-template-columns:1fr}.visual{padding:7px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero"><h1>Game Math Basics</h1><p>Eight short, visual lessons for the math you will repeatedly use when building movement, cameras, physics, and gameplay systems.</p></header>
    <div class="layout">
      <nav class="course-nav" aria-label="Course lessons">
        <div class="progress-label"><span>Course progress</span><strong id="progressText">0 / 8</strong></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="nav-list" id="navList"></div>
      </nav>
      <article class="lesson">
        <div class="eyebrow" id="lessonNumber"></div><h2 id="lessonTitle"></h2><p class="lead" id="lessonLead"></p>
        <section class="visual" aria-label="Interactive lesson demonstration">
          <canvas id="canvas" width="900" height="450"></canvas>
          <div class="controls" id="controls"></div>
        </section>
        <div class="readout" id="readout" aria-live="polite"></div>
        <div class="explain">
          <section class="box"><h3>The idea</h3><p id="idea"></p><div class="formula" id="formula"></div></section>
          <section class="box"><h3>Game-code connection</h3><pre><code id="code"></code></pre></section>
        </div>
        <div class="footer-actions"><button class="btn" id="previous">← Previous</button><button class="btn primary" id="complete">Mark complete & next →</button></div>
      </article>
    </div>
  </main>
  <script>
    const lessons=[
      {title:'Coordinates and position',lead:'A position is simply an address in space. Move the point and watch its X and Y coordinates change.',idea:'X describes horizontal position and Y describes vertical position. A coordinate is not movement—it only tells us where something currently is.',formula:'position = (x, y)',code:'Vector2 position = { 3.0f, 2.0f };\nposition.x += 1.0f;',stats:['X position','Y position','Distance from origin']},
      {title:'Vectors: direction and length',lead:'A vector packages a direction and an amount. Aim the arrow to see both properties change together.',idea:'The components tell you how far the arrow travels on each axis. Its length is found with the Pythagorean theorem.',formula:'length = √(x² + y²)',code:'Vector2 direction = target - position;\nfloat distance = direction.length();',stats:['Vector','Length','Angle']},
      {title:'Normalization',lead:'Normalization keeps a vector’s direction but changes its length to exactly one.',idea:'Unit vectors separate direction from speed. That prevents diagonal input like (1, 1) from moving about 41% faster.',formula:'unit = vector ÷ length',code:'Vector2 direction = input.normalized();\nvelocity = direction * speed;',stats:['Input vector','Raw length','Normalized length']},
      {title:'Movement and delta time',lead:'Frame rate should not decide how fast the player moves. Compare fixed-per-frame movement with time-based movement.',idea:'Delta time is the duration of the last frame. Multiplying by it turns speed per second into the correct distance for this frame.',formula:'distance = speed × Δt',code:'position += velocity * delta_time;',stats:['Simulation FPS','Wrong distance','Correct distance']},
      {title:'Velocity and acceleration',lead:'Velocity changes position. Acceleration changes velocity. Watch the ship speed up while thrust is applied.',idea:'Acceleration adds velocity over time, and velocity adds position over time. This is the core loop behind most movement simulations.',formula:'velocity += acceleration × Δt',code:'velocity += acceleration * delta_time;\nposition += velocity * delta_time;',stats:['Acceleration','Velocity','Position']},
      {title:'The dot product',lead:'The dot product tells you how similarly two directions point—useful for vision, lighting, slopes, and aiming.',idea:'For normalized vectors, 1 means the same direction, 0 means perpendicular, and −1 means opposite directions.',formula:'dot = A.x×B.x + A.y×B.y',code:'float facing = dot(forward, to_target);\nif (facing > 0.7f) detect_target();',stats:['Angle','Dot product','Meaning']},
      {title:'Interpolation',lead:'Interpolation moves between values. Compare constant-speed movement with lerp’s easing behavior.',idea:'Move-toward covers a fixed distance each second. Repeated lerp covers a fraction of the remaining distance, so it slows near the target.',formula:'lerp(a, b, t) = a + (b−a)×t',code:'smooth = lerp(smooth, target, 5.0f * dt);\nconstant = move_toward(constant, target, speed * dt);',stats:['Time','Lerp position','Constant-speed position']},
      {title:'Angles, sine, and projectiles',lead:'Sine and cosine turn an angle into direction. Gravity then bends that initial direction into a projectile arc.',idea:'Cosine supplies the horizontal component and sine supplies the vertical component. Gravity continuously subtracts from vertical velocity.',formula:'direction = (cos θ, sin θ)',code:'velocity = { cos(angle), sin(angle) } * speed;\nvelocity.y += gravity * delta_time;',stats:['Launch angle','Horizontal velocity','Vertical velocity']}
    ];
    const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
    const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const ui={nav:document.getElementById('navList'),num:document.getElementById('lessonNumber'),title:document.getElementById('lessonTitle'),lead:document.getElementById('lessonLead'),controls:document.getElementById('controls'),readout:document.getElementById('readout'),idea:document.getElementById('idea'),formula:document.getElementById('formula'),code:document.getElementById('code'),prev:document.getElementById('previous'),complete:document.getElementById('complete')};
    let index=0,last=performance.now(),state={},done=new Set(JSON.parse(localStorage.getItem('gameMathBasicsDone')||'[]'));
    const C=()=>({panel:css('--panel'),panel2:css('--panel2'),text:css('--text'),muted:css('--muted'),border:css('--border'),accent:css('--accent'),accent2:css('--accent2'),good:css('--good')});
    function line(x1,y1,x2,y2,color,w=2,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
    function arrow(x1,y1,x2,y2,color,label=''){line(x1,y1,x2,y2,color,4);const a=Math.atan2(y2-y1,x2-x1);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-13*Math.cos(a-.45),y2-13*Math.sin(a-.45));ctx.lineTo(x2-13*Math.cos(a+.45),y2-13*Math.sin(a+.45));ctx.fill();if(label){ctx.fillStyle=C().text;ctx.font='15px system-ui';ctx.fillText(label,x2+8,y2-8)}}
    function grid(){const c=C();ctx.fillStyle=c.panel;ctx.fillRect(0,0,900,450);ctx.strokeStyle=c.border;ctx.lineWidth=1;for(let x=50;x<900;x+=50)line(x,0,x,450,c.border);for(let y=25;y<450;y+=50)line(0,y,900,y,c.border);line(450,20,450,430,c.muted,2);line(20,225,880,225,c.muted,2)}
    function text(t,x,y,color=C().muted,align='left',size=15){ctx.fillStyle=color;ctx.font=`${size}px system-ui`;ctx.textAlign=align;ctx.fillText(t,x,y);ctx.textAlign='left'}
    function dot(x,y,color=C().accent,r=10){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
    function setStats(values){[...ui.readout.children].forEach((el,i)=>el.querySelector('strong').textContent=values[i])}
    function button(label,fn,primary=false){const b=document.createElement('button');b.className='btn'+(primary?' primary':'');b.textContent=label;b.onclick=fn;ui.controls.appendChild(b);return b}
    function slider(label,min,max,value,step,fn){const l=document.createElement('label');const span=document.createElement('span');span.textContent=`${label}: ${value}`;const input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.value=value;input.step=step;input.oninput=()=>{span.textContent=`${label}: ${input.value}`;fn(Number(input.value))};l.append(span,input);ui.controls.appendChild(l);return input}
    function resetState(){state={t:0,playing:true,x:450,y:225,mouseX:620,mouseY:120,fps:30,mode:'correct',accel:80,angle:45,trail:[],lerp:90,constant:90};ui.controls.innerHTML='';if(index===0)button('Reset point',()=>{state.mouseX=600;state.mouseY=125});if(index===2){button('Cardinal (1, 0)',()=>{state.mouseX=650;state.mouseY=225});button('Diagonal (1, −1)',()=>{state.mouseX=650;state.mouseY=75},true)}if(index===3){slider('Simulated FPS',15,144,30,1,v=>{state.fps=v;state.t=0});const b=button('Correct: use delta time',()=>{state.mode=state.mode==='correct'?'wrong':'correct';b.textContent=state.mode==='correct'?'Correct: use delta time':'Wrong: per frame';b.setAttribute('aria-pressed',state.mode==='correct');state.t=0},true)}if(index===4)slider('Acceleration',20,160,80,5,v=>state.accel=v);if(index===5)slider('Target angle',0,180,45,1,v=>state.angle=v);if(index===6)button('Restart race',()=>{state.t=0;state.lerp=90;state.constant=90},true);if(index===7){slider('Launch angle',15,75,45,1,v=>{state.angle=v;state.t=0;state.trail=[]});button('Restart',()=>{state.t=0;state.trail=[]},true)}}
    function renderLesson(){const l=lessons[index];ui.num.textContent=`Lesson ${index+1} of ${lessons.length}`;ui.title.textContent=l.title;ui.lead.textContent=l.lead;ui.idea.textContent=l.idea;ui.formula.textContent=l.formula;ui.code.textContent=l.code;ui.readout.innerHTML=l.stats.map(s=>`<div class="stat"><small>${s}</small><strong>—</strong></div>`).join('');ui.prev.disabled=index===0;ui.complete.textContent=done.has(index)?(index===lessons.length-1?'Completed ✓':'Next lesson →'):'Mark complete & next →';[...ui.nav.children].forEach((b,i)=>b.classList.toggle('active',i===index));resetState()}
    function updateProgress(){document.getElementById('progressText').textContent=`${done.size} / ${lessons.length}`;document.getElementById('progressFill').style.width=`${done.size/lessons.length*100}%`;[...ui.nav.children].forEach((b,i)=>b.classList.toggle('done',done.has(i)));localStorage.setItem('gameMathBasicsDone',JSON.stringify([...done]))}
    lessons.forEach((l,i)=>{const b=document.createElement('button');b.className='nav-button';b.innerHTML=`<span class="num">${i+1}</span><span>${l.title}</span>`;b.onclick=()=>{index=i;renderLesson()};ui.nav.appendChild(b)});
    canvas.addEventListener('pointerdown',e=>{if(index>2)return;const r=canvas.getBoundingClientRect();state.mouseX=(e.clientX-r.left)*canvas.width/r.width;state.mouseY=(e.clientY-r.top)*canvas.height/r.height;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!canvas.hasPointerCapture(e.pointerId)||index>2)return;const r=canvas.getBoundingClientRect();state.mouseX=(e.clientX-r.left)*canvas.width/r.width;state.mouseY=(e.clientY-r.top)*canvas.height/r.height});
    function drawLesson(dt){grid();const c=C(),cx=450,cy=225;
      if(index===0){const x=(state.mouseX-cx)/50,y=(cy-state.mouseY)/50;dot(state.mouseX,state.mouseY);line(state.mouseX,cy,state.mouseX,state.mouseY,c.accent,2,[6,5]);line(cx,state.mouseY,state.mouseX,state.mouseY,c.accent,2,[6,5]);text('Drag me',state.mouseX+16,state.mouseY-14,c.text);text('origin (0, 0)',cx+10,cy+22);setStats([x.toFixed(2),y.toFixed(2),Math.hypot(x,y).toFixed(2)+' units'])}
      if(index===1||index===2){const dx=(state.mouseX-cx)/100,dy=(cy-state.mouseY)/100,len=Math.hypot(dx,dy),nx=len?dx/len:0,ny=len?dy/len:0;arrow(cx,cy,state.mouseX,state.mouseY,c.accent,'vector');line(state.mouseX,cy,state.mouseX,state.mouseY,c.border,2,[5,5]);line(cx,state.mouseY,state.mouseX,state.mouseY,c.border,2,[5,5]);if(index===1)setStats([`(${dx.toFixed(2)}, ${dy.toFixed(2)})`,len.toFixed(3),`${(Math.atan2(dy,dx)*180/Math.PI).toFixed(1)}°`]);else{arrow(cx,cy,cx+nx*100,cy-ny*100,c.accent2,'unit');setStats([`(${dx.toFixed(2)}, ${dy.toFixed(2)})`,len.toFixed(3),len?'1.000':'0.000'])}}
      if(index===3){state.t+=dt;const seconds=state.t%6,speed=100;const frames=Math.floor(seconds*state.fps);const wrong=Math.min(760,70+frames*2);const correct=Math.min(760,70+speed*seconds);text('Moves 2 pixels every frame',70,95,c.muted);text('Moves 100 pixels every second',70,265,c.muted);line(70,135,820,135,c.border,4);line(70,305,820,305,c.border,4);dot(state.mode==='wrong'?wrong:correct,135,c.accent2);dot(correct,305,c.good);setStats([`${state.fps} FPS`,`${Math.round(frames*2)} px`,`${Math.round(speed*seconds)} px`])}
      if(index===4){state.t=(state.t+dt)%5;const v=state.accel*state.t;const x=70+.5*state.accel*state.t*state.t;const sx=70+(x-70)%750;line(70,320,830,320,c.border,4);dot(sx,300,c.accent,13);arrow(sx,300,Math.min(855,sx+Math.min(160,v*.35)),300,c.accent,'velocity');arrow(sx,355,sx+80,355,c.accent2,'acceleration');setStats([`${state.accel.toFixed(0)} px/s²`,`${v.toFixed(1)} px/s`,`${(.5*state.accel*state.t*state.t).toFixed(1)} px`])}
      if(index===5){const a=state.angle*Math.PI/180,r=150;arrow(cx,cy,cx+r,cy,c.accent,'forward');arrow(cx,cy,cx+Math.cos(a)*r,cy-Math.sin(a)*r,c.accent2,'to target');ctx.strokeStyle=c.muted;ctx.beginPath();ctx.arc(cx,cy,65,-a,0);ctx.stroke();text(`${state.angle.toFixed(0)}°`,cx+75,cy-18,c.text);const d=Math.cos(a);setStats([`${state.angle.toFixed(0)}°`,d.toFixed(3),d>.7?'Mostly ahead':d>0?'In front':Math.abs(d)<.02?'Perpendicular':'Behind'])}
      if(index===6){state.t+=dt;const target=800;state.lerp+=(target-state.lerp)*Math.min(1,2.2*dt);state.constant=Math.min(target,state.constant+150*dt);text('Repeated lerp: fast start, gentle finish',70,100,c.muted);text('Move toward: constant speed',70,270,c.muted);line(90,140,800,140,c.border,4);line(90,310,800,310,c.border,4);dot(state.lerp,140,c.accent);dot(state.constant,310,c.accent2);line(800,110,800,330,c.good,3);text('target',800,90,c.good,'center');setStats([`${state.t.toFixed(1)} s`,`${state.lerp.toFixed(1)} px`,`${state.constant.toFixed(1)} px`])}
      if(index===7){state.t+=dt;const angle=state.angle*Math.PI/180,speed=170,g=130,vx=Math.cos(angle)*speed,vy=Math.sin(angle)*speed;let t=state.t%((2*vy/g)+.8);if(t>2*vy/g)t=2*vy/g;const x=70+vx*t,y=350-(vy*t-.5*g*t*t);state.trail.push([x,y]);if(state.trail.length>160||t<dt*2)state.trail=[];ctx.strokeStyle=c.accent;ctx.lineWidth=3;ctx.beginPath();state.trail.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();dot(x,y,c.accent,9);arrow(x,y,x+vx*.35,y-(vy-g*t)*.35,c.accent,'velocity');arrow(70,350,70+Math.cos(angle)*100,350-Math.sin(angle)*100,c.accent2,'launch');line(30,350,870,350,c.border,4);setStats([`${state.angle.toFixed(0)}°`,`${vx.toFixed(1)} px/s`,`${(vy-g*t).toFixed(1)} px/s`])}
    }
    function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;drawLesson(dt);requestAnimationFrame(frame)}
    ui.prev.onclick=()=>{if(index>0){index--;renderLesson()}};ui.complete.onclick=()=>{done.add(index);updateProgress();if(index<lessons.length-1){index++;renderLesson()}else ui.complete.textContent='Course complete ✓'};
    updateProgress();renderLesson();requestAnimationFrame(frame);
  </script>
</body>
</html>
